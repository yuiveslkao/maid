# maid 用 Open-LLM-VTuber v1.2.1 の設定（maid で使う項目だけ）
# 元: Open-LLM-VTuber v1.2.1 config_templates/conf.default.yaml (MIT License, Copyright (c) 2025 Yi-Ting Chiu)
# setup が runtime\Open-LLM-VTuber\conf.yaml にコピーする（既にあれば上書きしない）。
# 書き換えるのはキャラの部分（character_name / human_name / persona_prompt）だけで大丈夫。
# 頭脳のモデル・声・音声認識は maid.settings.json と maid が決める（ここの値は使われないか、起動時に上書きされる）。

system_config:
  conf_version: 'v1.2.1'
  host: 'localhost'
  port: 12393
  config_alts_dir: 'characters'
  tool_prompts:
    # キャラから話しかけるときの指示（画面の設定で ON にしたとき）
    proactive_speak_prompt: 'proactive_speak_prompt'

character_config:
  conf_name: 'mao_pro'
  conf_uid: 'mao_pro_001'
  live2d_model_name: 'mao_pro'
  avatar: 'mao.png'
  character_name: 'メイド' # キャラの名前（画面に出る）
  human_name: 'ご主人様' # あなたの名前（画面に出る）

  # 性格・口調はここに書く。返事を速くするため「短く話す」決まりは残すのがおすすめ。
  # 今の日時と Web 検索の結果は頭脳の中継 (services/llm_proxy.py) が足すので、ここに書かなくてよい。
  persona_prompt: |
    あなたは「メイド」という名前の、ご主人様専属のアシスタントです。
    （ここに性格・口調・一人称・関係性などを書いてください）

    話し方のルール:
    - 返答は日本語の話し言葉で、基本は1〜3文の短さにする。
    - 最初の一文はとくに短くする（例:「うん、わかった！」「えっとね、」）。
    - 箇条書き・記号・絵文字・URL は使わない（読み上げられるため）。
    - わからないことは正直にわからないと言う。
    - 天気・ニュース・イベントの日程など最新の情報は、Web 検索の結果が渡されたときだけそれを使って答える。結果が無いときは推測で答えない。

  agent_config:
    conversation_agent_choice: 'basic_memory_agent'
    agent_settings:
      basic_memory_agent:
        llm_provider: 'ollama_llm'
        faster_first_response: true # 最初の読点で読み上げを始める（返事が速く聞こえる）
        segment_method: 'pysbd'
        use_mcpp: false # Open-LLM-VTuber のツールは使わない（検索は頭脳の中継が行う）
        mcp_enabled_servers: []
    llm_configs:
      ollama_llm:
        base_url: 'http://localhost:11434/v1' # maid の頭脳の中継（本物の Ollama は 11436）
        model: 'maid' # 何でもよい。実際のモデルは maid.settings.json の model（頭脳の中継がすり替える）
        temperature: 0.7
        keep_alive: -1
        unload_at_exit: true

  # 音声認識: ReazonSpeech（日本語専用, CPU）。maid が起動のたびにこの内容にそろえる
  asr_config:
    asr_model: 'sherpa_onnx_asr'
    sherpa_onnx_asr:
      model_type: 'transducer'
      encoder: './models/sherpa-onnx-zipformer-ja-reazonspeech-2024-08-01/encoder-epoch-99-avg-1.int8.onnx'
      decoder: './models/sherpa-onnx-zipformer-ja-reazonspeech-2024-08-01/decoder-epoch-99-avg-1.int8.onnx'
      joiner: './models/sherpa-onnx-zipformer-ja-reazonspeech-2024-08-01/joiner-epoch-99-avg-1.int8.onnx'
      tokens: './models/sherpa-onnx-zipformer-ja-reazonspeech-2024-08-01/tokens.txt'
      num_threads: 6 # i7-11700F（8 コア）向け
      use_itn: false
      provider: 'cpu'

  # 声: services/tts_bridge.py 経由で AivisSpeech。声の種類と速さは maid.settings.json の voice / speed
  tts_config:
    tts_model: 'openai_tts'
    openai_tts:
      model: 'aivisspeech'
      voice: 'default'
      api_key: 'not-needed'
      base_url: 'http://127.0.0.1:10102/v1'
      file_extension: 'wav'

  # 話し始め・終わりの判定は画面側で行う（maid が起動のたびに設定する）
  vad_config:
    vad_model: null

  tts_preprocessor_config:
    remove_special_char: true # 絵文字などを読み上げない
    ignore_brackets: true # [ ] の中を読み上げない（検索の出典はここに入る）
    ignore_parentheses: true # ( ) の中を読み上げない
    ignore_asterisks: true
    ignore_angle_brackets: true
    translator_config:
      translate_audio: false
      translate_provider: 'deeplx'
