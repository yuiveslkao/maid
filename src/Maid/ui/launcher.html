<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>maid を起動</title>
<!-- maid: 起動の画面（maid.exe が開く）。選んだ内容は maid.settings.json に保存する -->
<style>
  :root { --bg: #fff7fa; --panel: #fff; --line: #f3d3df; --accent: #f27aa6; --text: #3b2a33; --sub: #9a7f8b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Yu Gothic UI", "Meiryo UI", system-ui, sans-serif; font-size: 14px; }
  body { padding: 18px 20px 80px; }
  h1 { font-size: 20px; margin: 0 0 14px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  h2 { font-size: 14px; margin: 0 0 8px; color: var(--sub); font-weight: normal; }
  label.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; }
  label.row small { display: block; color: var(--sub); font-size: 12px; }
  select, input[type=number] { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  input[type=number] { width: 60px; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  .icons { display: flex; gap: 22px; }
  .iconbox { text-align: center; }
  .iconbox img, .iconbox .ph { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 2px solid var(--line); display: block; margin: 0 auto 6px; background: var(--line); }
  .iconbox button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 3px 10px; cursor: pointer; margin: 2px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: flex-end; gap: 10px; padding: 12px 20px;
    background: var(--panel); border-top: 1px solid var(--line); }
  .bar button { font: inherit; font-weight: bold; border-radius: 12px; padding: 9px 22px; cursor: pointer; border: 1px solid var(--line); background: #fff; }
  .bar button.go { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>
<h1 id="title">maid を起動</h1>

<section>
  <h2>使うもの</h2>
  <label class="row"><span>声で返事する<small>AivisSpeech も起動する（メモリを 1GB ほど使う。会話の画面の「声」でも切り替えられる）</small></span><input type="checkbox" id="voice_reply"></label>
  <label class="row"><span>マイクを使う<small>声で話しかける。キーボードだけなら外す（会話の画面の「マイク」でも切り替えられる）</small></span><input type="checkbox" id="mic"></label>
  <label class="row"><span>Web 検索<small>「調べて」と頼んだとき（おまかせ: 最新の情報が要りそうなときも）</small></span>
    <select id="search"><option value="auto">おまかせ</option><option value="explicit">頼んだときだけ</option><option value="off">使わない</option></select></label>
  <label class="row"><span>覚える<small>会話から、あなたのことや今のことを覚える（data フォルダ）</small></span><input type="checkbox" id="memory"></label>
  <label class="row"><span>キャラから話しかける<small>この分数、会話が無かったら</small></span>
    <span><input type="checkbox" id="proactive"> <input type="number" id="proactive_minutes" min="1" max="240"> 分</span></label>
</section>

<section>
  <h2>アイコン</h2>
  <div class="icons">
    <div class="iconbox" data-kind="character"><span class="ph"></span><div id="charLabel">キャラ</div>
      <button data-act="pick">えらぶ</button><button data-act="remove">消す</button></div>
    <div class="iconbox" data-kind="user"><span class="ph"></span><div>じぶん</div>
      <button data-act="pick">えらぶ</button><button data-act="remove">消す</button></div>
  </div>
  <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none">
</section>

<div class="bar">
  <button id="quit">やめる</button>
  <button id="go" class="go">起動</button>
</div>

<script>
(function () {
  var api = window.maidApi;
  var pickingKind = null;
  var $ = function (id) { return document.getElementById(id); };

  function showIcon(kind, src) {
    var box = document.querySelector('.iconbox[data-kind="' + kind + '"]');
    var old = box.querySelector("img, .ph");
    var el = document.createElement(src ? "img" : "span");
    el.className = src ? "" : "ph";
    if (src) el.src = src;
    old.replaceWith(el);
  }

  document.querySelectorAll(".iconbox button").forEach(function (b) {
    b.onclick = function () {
      var kind = b.closest(".iconbox").dataset.kind;
      if (b.dataset.act === "remove") { api.remove_icon(kind); showIcon(kind, null); return; }
      pickingKind = kind; $("file").value = ""; $("file").click();
    };
  });
  $("file").onchange = function () {
    var f = $("file").files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      api.save_icon(pickingKind, r.result).then(function (src) { showIcon(pickingKind, src); });
    };
    r.readAsDataURL(f);
  };
  $("proactive").onchange = function () { $("proactive_minutes").disabled = !$("proactive").checked; };

  $("go").onclick = function () {
    api.launch({
      voice_reply: $("voice_reply").checked,
      mic: $("mic").checked,
      search: $("search").value,
      memory: $("memory").checked,
      proactive_minutes: $("proactive").checked ? Math.max(1, parseInt($("proactive_minutes").value || "15", 10)) : 0
    });
  };
  $("quit").onclick = function () { api.quit(); };

  window.addEventListener("maidready", function () {
    api.load().then(function (s) {
      $("title").textContent = s.name + " を起動";
      $("charLabel").textContent = s.name;
      $("voice_reply").checked = !!s.voice_reply;
      $("mic").checked = !!s.mic;
      $("search").value = s.search || "auto";
      $("memory").checked = s.memory !== false;
      $("proactive").checked = s.proactive_minutes > 0;
      $("proactive_minutes").value = s.proactive_minutes > 0 ? s.proactive_minutes : 15;
      $("proactive_minutes").disabled = !(s.proactive_minutes > 0);
      showIcon("character", s.icons.character);
      showIcon("user", s.icons.user);
    });
  });
})();
</script>
</body>
</html>
