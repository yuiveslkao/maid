<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>maid</title>
<!-- maid: 会話の画面（maid.exe が開く。中身は Conversation.cs） -->
<style>
  :root {
    --bg: #fff7fa; --panel: #ffffff; --line: #f3d3df; --accent: #f27aa6; --accent-dark: #d95a8a;
    --me: #ffe3ee; --her: #ffffff; --text: #3b2a33; --sub: #9a7f8b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Yu Gothic UI", "Meiryo UI", system-ui, sans-serif; font-size: 15px; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--panel);
    border-bottom: 1px solid var(--line); }
  header .name { font-weight: bold; font-size: 16px; flex: 1; }
  header button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px;
    padding: 5px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  header button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  header button.hearing { box-shadow: 0 0 0 3px #f9c2d6; }
  #micNote, #status { font-size: 12px; color: var(--sub); }
  #closing { display: none; position: fixed; inset: 0; background: rgba(255,247,250,.92); align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; font-size: 16px; }
  #closing.on { display: flex; }
  #closing small { color: var(--sub); font-size: 13px; }
  .icon { width: 40px; height: 40px; border-radius: 50%; flex: none; object-fit: cover; background: var(--line);
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; }
  #log { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; }
  .row.me { flex-direction: row-reverse; }
  .bubble { padding: 9px 13px; border-radius: 16px; background: var(--her); border: 1px solid var(--line);
    white-space: pre-wrap; word-break: break-word; max-width: min(560px, 75%); line-height: 1.6; }
  .row.me .bubble { background: var(--me); border-color: var(--me); }
  .bubble.thinking::after { content: "…"; color: var(--sub); }
  .sources { display: block; margin-top: 6px; font-size: 12px; color: var(--sub); }
  .sources a { color: var(--accent-dark); margin-right: 8px; cursor: pointer; text-decoration: underline; }
  footer { display: flex; gap: 8px; padding: 10px 14px; background: var(--panel); border-top: 1px solid var(--line); }
  #attach { display: none; gap: 8px; padding: 8px 14px 0; background: var(--panel); border-top: 1px solid var(--line); }
  #attach.on { display: flex; }
  #attach + footer { border-top: none; }
  .thumb { position: relative; }
  .thumb img, .bubble img { height: 72px; border-radius: 8px; border: 1px solid var(--line); display: block; }
  .bubble img { height: 120px; max-width: 100%; object-fit: contain; margin-top: 6px; }
  .thumb button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: none;
    background: var(--sub); color: #fff; font-size: 12px; line-height: 20px; padding: 0; cursor: pointer; }
  .tag { display: block; margin-top: 4px; font-size: 12px; color: var(--sub); }
  footer button.look { background: var(--panel); color: var(--text); border: 1px solid var(--line); font-weight: normal; padding: 0 12px; }
  body.drop #log { outline: 3px dashed var(--accent); outline-offset: -6px; }
  textarea { flex: 1; resize: none; height: 44px; max-height: 140px; padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--line); font: inherit; color: var(--text); background: var(--bg); outline: none; }
  textarea:focus { border-color: var(--accent); }
  footer button { border: none; background: var(--accent); color: #fff; border-radius: 12px; padding: 0 18px;
    font: inherit; font-weight: bold; cursor: pointer; }
  footer button.stop { background: var(--sub); }
  .empty { color: var(--sub); text-align: center; margin-top: 30px; }
</style>
</head>
<body>
<header>
  <div id="charIcon" class="icon"></div>
  <div class="name" id="charName"></div>
  <span id="status"></span>
  <span id="micNote"></span>
  <button id="micBtn" title="声で話しかける">マイク</button>
  <button id="voiceBtn" title="声で返事する">声</button>
  <button id="clearBtn" title="画面の会話を消す（覚えたことは消えません）">会話を消す</button>
</header>
<div id="log"></div>
<div id="closing">記憶をまとめています…<small>少しかかります。もう一度閉じると、まとめずにすぐ終わります</small></div>
<div id="attach"></div>
<footer>
  <button id="lookBtn" class="look" title="今の画面を撮って見せる（このウィンドウは写りません）">画面を見せる</button>
  <textarea id="input" placeholder="メッセージ（Enter で送る。画像は貼り付け・ドラッグでも OK）"></textarea>
  <button id="sendBtn">送る</button>
</footer>
<script>
(function () {
  var api = window.maidApi;
  var log = document.getElementById("log"), input = document.getElementById("input");
  var sendBtn = document.getElementById("sendBtn"), voiceBtn = document.getElementById("voiceBtn");
  var micBtn = document.getElementById("micBtn"), micNote = document.getElementById("micNote"), mic = false;
  var MIC_NOTES = { loading: "音声認識を準備中…", discord: "Discord 通話中は聞きません", error: "マイクを使えません" };
  var info = { name: "", human: "", icons: {} }, voice = false, current = null, currentText = "", busy = false;
  var sayQueue = [], playing = null, attached = [];  // sayQueue: 声で返事するときの { 声, 文 }。null の文は返事の終わり
  var attachEl = document.getElementById("attach"), lookBtn = document.getElementById("lookBtn");

  function iconEl(kind) {
    var src = info.icons[kind];
    var el = document.createElement(src ? "img" : "div");
    el.className = "icon";
    if (src) el.src = src;
    else { el.textContent = ((kind === "character" ? info.name : info.human) || "?").slice(0, 1);
           el.style.background = kind === "character" ? "#f27aa6" : "#b9a2ad"; }
    return el;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }

  // 返事の中の <think>出典: URL / URL。</think> は、小さなリンクとして出す
  function render(el, text) {
    var sources = [];
    var body = text.replace(/<think>([\s\S]*?)(<\/think>|$)/g, function (_, inner) {
      (inner.match(/https?:\/\/[^\s/]+[^\s。]*/g) || []).forEach(function (u) { sources.push(u.replace(/[。、]+$/, "")); });
      return "";
    });
    var html = escapeHtml(body.trim());
    if (sources.length) {
      html += '<span class="sources">出典: ' + sources.map(function (u) {
        return '<a data-url="' + escapeHtml(u) + '">' + escapeHtml(u.replace(/^https?:\/\//, "").split("/")[0]) + "</a>";
      }).join("") + "</span>";
    }
    el.innerHTML = html;
  }

  function addImages(bubble, images) {
    (images || []).forEach(function (src) {
      var img = document.createElement("img");
      img.src = src;
      bubble.appendChild(img);
    });
  }

  function addRow(kind, text, images, imageCount) {
    var empty = log.querySelector(".empty");
    if (empty) empty.remove();
    var row = document.createElement("div");
    row.className = "row" + (kind === "user" ? " me" : "");
    row.appendChild(iconEl(kind === "user" ? "user" : "character"));
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    render(bubble, text || "");
    addImages(bubble, images);
    if (!images && imageCount) {
      var tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = "（画像を " + imageCount + " 枚見せた）";
      bubble.appendChild(tag);
    }
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return bubble;
  }

  function setBusy(b) {
    busy = b;
    sendBtn.textContent = b ? "止める" : "送る";
    sendBtn.className = b ? "stop" : "";
  }

  function startReply() {
    current = addRow("character", "");
    current.classList.add("thinking");
    currentText = "";
    setBusy(true);
  }

  function stopAudio() {
    sayQueue.length = 0;
    if (playing) { playing.pause(); playing = null; }
  }

  // 声を鳴らしはじめるときに、その文を出す（声と文字をそろえる）
  function playNext() {
    while (!playing && sayQueue.length) {
      var item = sayQueue.shift();
      if (item.text === null) { window.maid.done(); continue; }
      window.maid.chunk(item.text);
      if (!item.b64 || !voice) continue;
      var a = new Audio("data:audio/wav;base64," + item.b64);
      playing = a;
      var next = function (a) { return function () { if (playing === a) { playing = null; playNext(); } }; }(a);
      a.onended = next; a.onerror = next;
      a.play().catch(next);
    }
  }

  // Python（app/maid_app.py）から呼ばれる
  window.maid = {
    proactive: function () { if (!busy) startReply(); },
    chunk: function (t) {
      if (!current) startReply();
      currentText += t;
      render(current, currentText);
      log.scrollTop = log.scrollHeight;
    },
    done: function () {
      if (current) { current.classList.remove("thinking"); if (!currentText) render(current, "（返事がありませんでした）"); }
      current = null;
      setBusy(false);
    },
    say: function (b64, text) { sayQueue.push({ b64: b64, text: text }); playNext(); },
    // 声で話しかけられた（返事の途中なら、そこで打ち切って次の返事へ）
    heard: function (t, images) {
      stopAudio();
      if (current) {
        current.classList.remove("thinking");
        if (!currentText) current.parentNode.remove();
        current = null;
      }
      addRow("user", t, images && images.length ? images : null);
      startReply();
    },
    micState: function (st) { showMic(st); },
    status: function (text) { document.getElementById("status").textContent = text; },
    closing: function () { document.getElementById("closing").className = "on"; }
  };

  var micFailed = false;  // 画面でマイクを開けなかった（Python から届く状態より優先して出す）
  function showMic(st) {
    if (micFailed) st = "error";
    micBtn.className = mic ? (st === "speaking" ? "on hearing" : "on") : "";
    micNote.textContent = mic ? (MIC_NOTES[st] || "") : "";
  }

  // 次に送るメッセージに付ける画像
  function showAttached() {
    attachEl.innerHTML = "";
    attachEl.className = attached.length ? "on" : "";
    attached.forEach(function (src, i) {
      var box = document.createElement("div");
      box.className = "thumb";
      box.innerHTML = '<img><button title="外す">×</button>';
      box.querySelector("img").src = src;
      box.querySelector("button").onclick = function () { attached.splice(i, 1); showAttached(); };
      attachEl.appendChild(box);
    });
  }

  function attachFile(file) {
    if (!file || !/^image\//.test(file.type)) return;
    var r = new FileReader();
    r.onload = function () {
      api.shrink(r.result).then(function (src) { attached.push(src); showAttached(); });
    };
    r.readAsDataURL(file);
  }

  function send() {
    if (busy) {  // 止める
      stopAudio();
      api.stop();
      return;
    }
    var text = input.value.trim();
    if (!text && !attached.length) return;
    var images = attached;
    attached = [];
    showAttached();
    input.value = "";
    stopAudio();
    addRow("user", text, images.length ? images : null);
    startReply();
    api.send(text, images);
  }

  lookBtn.onclick = function () {
    lookBtn.disabled = true;
    api.capture().then(function (src) { attached.push(src); showAttached(); input.focus(); })
      .finally(function () { lookBtn.disabled = false; });
  };
  input.addEventListener("paste", function (e) {
    Array.prototype.forEach.call((e.clipboardData && e.clipboardData.files) || [], attachFile);
  });
  document.addEventListener("dragover", function (e) { e.preventDefault(); document.body.classList.add("drop"); });
  document.addEventListener("dragleave", function (e) { if (!e.relatedTarget) document.body.classList.remove("drop"); });
  document.addEventListener("drop", function (e) {
    e.preventDefault();
    document.body.classList.remove("drop");
    Array.prototype.forEach.call(e.dataTransfer.files || [], attachFile);
  });

  sendBtn.onclick = send;
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  // マイク: ブラウザと同じ雑音の除去・エコーの除去・音量の自動調整をかけて、16kHz の音を 0.1 秒ごとに Python へ渡す
  var micIn = null;
  function sendSamples(f32) {
    var m = micIn;
    if (!m) return;
    for (var i = 0; i < f32.length; i++) {
      var v = Math.max(-1, Math.min(1, f32[i]));
      m.pcm[m.n++] = v < 0 ? v * 0x8000 : v * 0x7fff;
      if (m.n === m.pcm.length) {
        var bytes = new Uint8Array(m.pcm.buffer), bin = "";
        for (var k = 0; k < bytes.length; k += 4096) bin += String.fromCharCode.apply(null, bytes.subarray(k, k + 4096));
        api.hear(btoa(bin));
        m.n = 0;
      }
    }
  }

  function openMic() {
    if (micIn) return;
    micFailed = false;
    micIn = { pcm: new Int16Array(1600), n: 0 };
    var m = micIn;
    navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } })
      .then(function (stream) {
        if (micIn !== m) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
        m.stream = stream;
        m.ctx = new AudioContext({ sampleRate: 16000 });
        var src = m.ctx.createMediaStreamSource(stream), silent = m.ctx.createGain();
        silent.gain.value = 0;  // 鳴らさない（つないでおかないと処理が止まる）
        silent.connect(m.ctx.destination);
        var code = "class P extends AudioWorkletProcessor { process(i) { if (i[0] && i[0][0]) this.port.postMessage(i[0][0].slice(0)); return true; } }" +
                   " registerProcessor('maid-mic', P);";
        return m.ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([code], { type: "application/javascript" })))
          .then(function () {
            var node = new AudioWorkletNode(m.ctx, "maid-mic");
            node.port.onmessage = function (e) { if (micIn === m) sendSamples(e.data); };
            src.connect(node); node.connect(silent);
          }, function () {  // AudioWorklet が使えないとき
            var node = m.ctx.createScriptProcessor(4096, 1, 1);
            node.onaudioprocess = function (e) { if (micIn === m) sendSamples(e.inputBuffer.getChannelData(0)); };
            src.connect(node); node.connect(silent);
          })
          .then(function () { return m.ctx.resume(); });
      })
      .catch(function (e) {
        closeMic();
        micFailed = true;
        showMic("error");
        api.mic_error(String(e && (e.name + ": " + e.message) || e));
      });
  }

  function closeMic() {
    var m = micIn;
    micIn = null;
    if (!m) return;
    if (m.stream) m.stream.getTracks().forEach(function (t) { t.stop(); });
    if (m.ctx) m.ctx.close();
  }

  micBtn.onclick = function () {
    mic = !mic;
    if (mic) openMic(); else closeMic();
    showMic("off");
    api.set_mic(mic).then(showMic);
  };
  voiceBtn.onclick = function () {
    voice = !voice;
    voiceBtn.className = voice ? "on" : "";
    if (!voice && playing) { playing.pause(); playing = null; playNext(); }  // 残りの文は声なしで出す
    api.set_voice(voice);
  };
  document.getElementById("clearBtn").onclick = function () {
    if (!confirm("画面の会話を消しますか？（覚えたことは消えません）")) return;
    api.clear();
    log.innerHTML = '<div class="empty">話しかけてみてね</div>';
  };
  log.addEventListener("click", function (e) {
    var url = e.target.getAttribute && e.target.getAttribute("data-url");
    if (url) api.open_url(url);
  });

  window.addEventListener("maidready", function () {
    api.init().then(function (r) {
      info = r;
      document.title = r.name;
      document.getElementById("charName").textContent = r.name;
      var head = document.getElementById("charIcon");
      head.replaceWith(Object.assign(iconEl("character"), { id: "charIcon" }));
      voice = r.voice;
      voiceBtn.className = voice ? "on" : "";
      voiceBtn.style.display = r.voiceAvailable ? "" : "none";
      mic = r.mic;
      micBtn.style.display = r.micAvailable ? "" : "none";
      showMic(r.micState);
      window.maid.status(r.status || "");
      if (mic && r.micAvailable) openMic();
      if (!r.history.length) log.innerHTML = '<div class="empty">話しかけてみてね</div>';
      r.history.forEach(function (m) { addRow(m.role === "user" ? "user" : "character", m.content, null, m.images); });
      input.focus();
    });
  });
})();
</script>
</body>
</html>
