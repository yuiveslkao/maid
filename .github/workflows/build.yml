# maid.exe を作る。できたもの（人に渡す用の maid フォルダ）は Actions の実行結果の「Artifacts」にある maid-win-x64（zip）からダウンロードする。
name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test tests/Maid.Tests -c Release
      - name: Publish
        run: dotnet publish src/Maid -c Release -o publish
      - name: Pack (maid.exe・ネイティブの DLL を入れた lib\・はじめに.txt。build.ps1 の dist\maid と同じ)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/maid/lib | Out-Null
          Move-Item publish/maid.exe out/maid/
          Get-ChildItem publish -Filter *.dll | Move-Item -Destination out/maid/lib/
          Copy-Item tools/dist-readme.txt "out/maid/はじめに.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: maid-win-x64
          path: out
