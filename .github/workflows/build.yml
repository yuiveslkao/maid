# maid.exe を作る。できたものは Actions の実行結果の「Artifacts」にある maid-win-x64（zip）からダウンロードする。
name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test tests/Maid.Tests -c Release
      - name: Publish
        run: dotnet publish src/Maid -c Release -o publish
      - name: Pack (maid.exe と、ネイティブの DLL を入れた lib\)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/lib | Out-Null
          Move-Item publish/maid.exe out/
          Get-ChildItem publish -Filter *.dll | Move-Item -Destination out/lib/
      - uses: actions/upload-artifact@v4
        with:
          name: maid-win-x64
          path: out
